name: Build cli

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Node.js environment
      uses: actions/setup-node@v7.1.0
      with:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: 24.14.0

    - name: Setup pnpm
      uses: pnpm/action-setup@v6.1.1
      with:
        version: 10.33.2

    - name: Build
      run: |
        pnpm install --frozen-lockfile
        # pnpm --filter @zcode/cli... build
        # node apps/zcode-cli/packages/cli/dist/zcode.cjs --version
        # node apps/zcode-cli/packages/cli/dist/zcode.cjs doctor --json
        pnpm bootstrap
        pnpm build:zcode --base-url https://invaild.address/zcode

    - name: check
      run: |
        ls -lh apps/zcode-cli/packages/cli/dist/
        tree

    - name: Single exec
      run: |
        pnpm build:sea:prepare
        pnpm --filter @zcode/cli sea --target linux-arm64

    - name: check
      run: |
        ls -lh apps/zcode-cli/packages/cli/dist/
        tree

    - uses: softprops/action-gh-release@v3
      with:
        tag_name: "cli"
        draft: false
        files: |
          apps/zcode-cli/packages/cli/dist/*
      env: 
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
